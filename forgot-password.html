<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReviewBoost - Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-container">
        <div class="login-card">

            <h2>Reset Password</h2>

            <p style="color: #6b7280; font-size: 14px; margin-bottom: 20px;">
                Enter your email address and we'll send you a link
                to reset your password.
            </p>

            <form id="resetForm">

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        required
                        autocomplete="email"
                        placeholder="you@company.com"
                    >
                </div>

                <button
                    type="submit"
                    class="primary-btn"
                    id="reset-btn"
                >
                    Send Reset Link
                </button>

            </form>

            <p
                id="status-msg"
                role="status"
                aria-live="polite"
                style="font-size: 14px; margin-top: 15px;"
            ></p>

            <p style="margin-top: 20px; font-size: 14px;">
                Remembered your password?
                <a
                    href="login.html"
                    style="color: #2563eb; text-decoration: none;"
                >
                    Log in
                </a>
            </p>

        </div>
    </div>

    <!-- STEP 1: Load Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- STEP 2: Load Supabase configuration -->
    <script src="api.js"></script>

    <!-- STEP 3: Password reset functionality -->
    <script>

        document.getElementById('resetForm')
            .addEventListener('submit', async function(event) {

                event.preventDefault();

                const email = document.getElementById('email')
                    .value.trim();

                const resetBtn = document.getElementById('reset-btn');
                const statusMsg = document.getElementById('status-msg');

                resetBtn.textContent = "Sending link...";
                resetBtn.disabled = true;

                statusMsg.textContent = "";

                try {

                    // Get the initialized Supabase client.
                    // Supports both original and updated api.js.
                    const client =
                        window.reviewBoostClient ||
                        (
                            typeof supabase !== "undefined" &&
                            supabase?.auth?.resetPasswordForEmail
                                ? supabase
                                : null
                        );

                    // Verify Supabase initialization
                    if (
                        !client ||
                        !client.auth ||
                        typeof client.auth.resetPasswordForEmail !== "function"
                    ) {
                        throw new Error(
                            "Supabase client is not initialized. " +
                            "Check that api.js is loading correctly."
                        );
                    }

                    // Password reset redirect URL
                    const redirectUrl = new URL(
                        "update-password.html",
                        window.location.href
                    ).href;

                    // Send password reset email
                    const { error } =
                        await client.auth.resetPasswordForEmail(
                            email,
                            {
                                redirectTo: redirectUrl
                            }
                        );

                    if (error) {
                        throw error;
                    }

                    // Success message
                    statusMsg.style.color = "green";

                    statusMsg.textContent =
                        "If this email is registered, a password " +
                        "reset link will be sent. Please check " +
                        "your inbox and spam folder.";

                    resetBtn.textContent = "Send Reset Link";

                } catch (error) {

                    console.error(
                        "Password reset error:",
                        error
                    );

                    statusMsg.style.color = "red";

                    statusMsg.textContent =
                        "Error: " + error.message;

                    resetBtn.textContent = "Send Reset Link";

                } finally {

                    resetBtn.disabled = false;

                }

            });

    </script>

</body>
</html>
