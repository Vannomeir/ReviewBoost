<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReviewBoost - Update Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <h2>Set New Password</h2>
            <p style="color: #6b7280; font-size: 14px; margin-bottom: 20px;">
                Please enter your new password below.
            </p>
            
            <p id="recovery-status" role="status" style="font-size: 14px; color: #6b7280; margin-bottom: 10px;">Checking your reset link...</p>
            <form id="updateForm">
                <div class="input-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="primary-btn" id="update-btn">Update Password</button>
            </form>
        </div>
    </div>

    <!-- Supabase CDN and Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="api.js"></script>
    <script>
        const form = document.getElementById('updateForm');
        const updateBtn = document.getElementById('update-btn');
        const status = document.getElementById('recovery-status');
        updateBtn.disabled = true;
        let hasSession = false;

        function setSessionReady(ready) {
            hasSession = ready;
            updateBtn.disabled = !ready;
            status.textContent = ready
                ? 'You can now set a new password.'
                : 'Reset link invalid or expired. Request a new link on the Forgot Password page.';
        }

        // Supabase processes the recovery link and creates a session in the browser.
        // Keep this callback synchronous; do not await auth API calls inside it.
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY' && session) setSessionReady(true);
            if (event === 'SIGNED_OUT') setSessionReady(false);
        });

        // Also handles a session already established before the event listener ran.
        (async () => {
            try {
                const { data, error } = await supabase.auth.getSession();
                if (error) throw error;
                setSessionReady(Boolean(data?.session));
            } catch (error) {
                console.error('Recovery session error:', error);
                setSessionReady(false);
            }
        })();

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!hasSession) {
                alert('Please open a valid password reset link from your email.');
                return;
            }
            const newPassword = document.getElementById('newPassword').value;
            if (newPassword.length < 8) {
                alert('Please use a password of at least 8 characters.');
                return;
            }
            updateBtn.textContent = 'Updating...';
            updateBtn.disabled = true;
            try {
                const { data, error: sessionError } = await supabase.auth.getSession();
                if (sessionError) throw sessionError;
                if (!data?.session) throw new Error('Your reset session has expired. Request another link.');

                const { error } = await supabase.auth.updateUser({ password: newPassword });
                if (error) throw error;
                // End the recovery session so the user can sign in with the new password.
                const { error: signOutError } = await supabase.auth.signOut();
                if (signOutError) console.warn('Password changed but sign-out failed:', signOutError.message);
                alert('Password updated successfully! Please sign in again.');
                window.location.assign('index.html');
            } catch (error) {
                console.error('Update password error:', error);
                alert('Could not update password: ' + (error?.message || 'Unknown error'));
                updateBtn.disabled = false;
            } finally {
                updateBtn.textContent = 'Update Password';
            }
        });
    </script>
</body>
</html>
