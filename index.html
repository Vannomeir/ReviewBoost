<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviewboost - Login</title>
    <!-- Links to your separate style sheet -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <h2>Welcome to Reviewboost</h2>
            <p>Please sign in to your account</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@company.com">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <!-- Dynamic Forgot Password Container -->
                    <div id="forgot-password-container" style="margin-bottom: 15px; text-align: right;"></div>
                <button type="submit" class="primary-btn">Sign In</button>
                <a href="signup.html" style="display: block; margin-top: 15px; text-align: center; color: #2563eb; text-decoration: none;">Don't have an account? Sign Up</a>
            </form>
        </div>
    </div>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="api.js"></script>
    <script src="login.js"></script>
</body>
</html>
